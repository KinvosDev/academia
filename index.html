function payStudentOptions(q){
  q=(q||"").toLowerCase().trim();
  return [...db.students].sort((x,y)=>(x.nom+x.prenom).localeCompare(y.nom+y.prenom))
    .filter(st=>!q || (st.nom+" "+st.prenom+" "+st.classe).toLowerCase().includes(q))
    .map(st=>`<option value="${st.id}">${esc(st.nom)} ${esc(st.prenom)} (${esc(st.classe)})</option>`).join("");
}
function payFiltreEleves(q){
  const sel=document.getElementById("p-student"); if(!sel) return;
  const cur=sel.value;
  sel.innerHTML='<option value="">-- Choisir --</option>'+payStudentOptions(q);
  if(cur) sel.value=cur;
  if(!sel.value && sel.options.length===2){ sel.selectedIndex=1; }
  payChoisi();
}
function payChoisi(){
  const sel=document.getElementById("p-student"), box=document.getElementById("p-info");
  if(!sel||!box) return;
  const st=db.students.find(x=>x.id===sel.value);
  if(!st){ box.className="pay-info"; box.innerHTML='<span class="muted">Choisissez un élève pour voir sa situation.</span>'; return; }
  const bal=feeBalance(st, "");
  box.className="pay-info "+(bal.remaining>0?"due":"ok");
  box.innerHTML=`<div><b>${esc(st.nom)} ${esc(st.prenom)}</b> · ${esc(st.classe)}</div>
    <div class="pay-nums"><span>Frais : <b>${formatFCFA(bal.due)}</b></span><span>Payé : <b>${formatFCFA(bal.paid)}</b></span><span>Reste : <b>${formatFCFA(bal.remaining)}</b></span></div>
    ${(()=>{ const f=studentFees(st), sn=scolName(); const ks=Object.keys(f).filter(n=>n!==sn); return ks.length? `<div class="pay-nums">${ks.map(n=>{ const pd=paidForType(st.id,n); return `<span>${esc(n)} : <b>${formatFCFA(pd)}</b> / ${formatFCFA(f[n])}${pd>=f[n]?" ✅":""}</span>`; }).join("")}</div>` : ""; })()}

/* ---- Choix de la classe (liste déroulante) et frais applicables (cases à cocher) ---- */
function classSelectHTML(id, current){
  const list=[...new Set([...ORDRE_CLASSES, ...allClasses()])];
  return `<select id="${id}" onchange="classAutre('${id}')"><option value="">-- Choisir --</option>${list.map(c=>`<option value="${esc(c)}" ${c===current?"selected":""}>${esc(c)}</option>`).join("")}<option value="__autre">Autre classe…</option></select><input id="${id}-autre" placeholder="Nom de la classe" style="display:none;margin-top:6px;">`;
}
function classAutre(id){ const sel=document.getElementById(id), inp=document.getElementById(id+"-autre"); if(!sel||!inp) return; inp.style.display = sel.value==="__autre" ? "block" : "none"; if(sel.value==="__autre") inp.focus(); }
function classValue(id){ const sel=document.getElementById(id); if(!sel) return ""; return sel.value==="__autre" ? val(id+"-autre") : sel.value; }
function scolName(){ const t=payTypes().find(x=>x.groupe==="scol"); return t? t.nom : "Frais de scolarité"; }
function studentFees(st){
  const o={...(st.fraisDus||{})}, sn=scolName();
  if(st.fraisDus){ if(sn in o) o[sn]=Number(st.fraisAnnuel)||0; }
  else if(Number(st.fraisAnnuel)>0) o[sn]=Number(st.fraisAnnuel);
  return o;
}
function feePickerHTML(pre, cur){
  return `<div class="fee-pick">${payTypes().map((t,i)=>{
    const has = cur ? (t.nom in cur) : (t.groupe==="scol");
    const m = (cur && (t.nom in cur)) ? cur[t.nom] : (Number(t.montant)>0 ? Number(t.montant) : "");
    return `<div class="fee-opt"><input type="checkbox" id="${pre}-chk-${i}" ${has?"checked":""} onchange="document.getElementById('${pre}-amt-${i}').disabled=!this.checked"><label for="${pre}-chk-${i}" class="fee-nm">${esc(t.nom)}</label><input type="number" inputmode="numeric" min="0" id="${pre}-amt-${i}" value="${m}" placeholder="Montant" ${has?"":"disabled"}><small>FCFA</small></div>`;
  }).join("")}</div>`;
}
function readFees(pre){
  const o={};
  payTypes().forEach((t,i)=>{ const c=document.getElementById(pre+"-chk-"+i); if(c && c.checked){ o[t.nom]=Math.max(0, Number(document.getElementById(pre+"-amt-"+i).value)||0); } });
  return o;
}
function feeBalance(st, type){
  const f=studentFees(st);
  const names = type ? (type in f ? [type] : []) : Object.keys(f);
  const due=names.reduce((a,n)=>a+(Number(f[n])||0),0);
  const paid=names.reduce((a,n)=>a+paidForType(st.id,n),0);
  return {due, paid, remaining:due-paid};
}
function paidForType(studentId, nom){
  const y=db.meta.anneeScolaireActuelle;
  return db.payments.filter(p=>p.studentId===studentId && p.categorie===nom && (p.anneeScolaire!==undefined? p.anneeScolaire : schoolYearOf(p.date))===y).reduce((a,p)=>a+(Number(p.montant)||0),0);
}
function payTypeChoisi(){
  const c=document.getElementById("p-categorie"), m=document.getElementById("p-montant");
  if(!c||!m) return;
  const t=payTypes().find(x=>x.nom===c.value);
  const sel=document.getElementById("p-student"), st= sel? db.students.find(x=>x.id===sel.value) : null;
  const fees= st? studentFees(st) : {};
  if(st && t && (t.nom in fees)){ m.value=Math.max(0, fees[t.nom]-paidForType(st.id,t.nom)); }
  else if(t && t.groupe!=="scol" && Number(t.montant)>0){ m.value=t.montant; }
}
function paySolder(){
  const sel=document.getElementById("p-student"), m=document.getElementById("p-montant");
  if(!sel||!m) return;
  const c=document.getElementById("p-categorie"), st=db.students.find(x=>x.id===sel.value);
  if(st){ const r=feeBalance(st, c? c.value : "").remaining; m.value = r>0 ? r : ""; }
  m.focus();
}

}

function moneyTabHTML(items, categories, title, icon, btnCls, kind){

    .filter(i=>(!fCat || i.categorie===fCat) && (!q || (i.description+" "+i.categorie).toLowerCase().includes(q)));
  const total = items.reduce((a,i)=>a+i.montant,0);
  const totalMois = items.filter(i=>monthKey(i.date)===mk).reduce((a,i)=>a+i.montant,0);
  const totalAff = sorted.reduce((a,i)=>a+i.montant,0);
  const cats = [...new Set(items.map(i=>i.categorie).filter(Boolean))];
  const rows = sorted.map(i=>`<tr>
    <td style="font-weight:600;">${esc(i.description)}</td><td>${esc(i.categorie)}</td><td style="font-weight:700;">${formatFCFA(i.montant)}</td><td>${formatDate(i.date)}</td>

  const cards = sorted.map(i=>`<div class="stu-card">
    <div class="stu-top">
      <div class="stu-id"><b>${esc(i.description)}</b><small>${esc(i.categorie)} · ${formatDate(i.date)}</small></div>

  return `<div class="grid-gap">

      <div class="row between wrap-gap" style="margin-bottom:12px;">
        <h3 class="title" style="margin:0;">Historique (${sorted.length}${(q||fCat)?" / "+items.length:""})</h3>
        <input id="${kind}-search" class="stu-search" style="max-width:260px;" placeholder="🔍 Rechercher…" value="${esc(window["__mq_"+kind]||"")}" oninput="window.__mq_${kind}=this.value; renderKeepFocus('${kind}-search');">

function cashTabHTML(){
  const list = [];
  db.payments.forEach(p=>list.push({id:p.id,date:p.date,type:"entrée",montant:p.montant,description:(p.categorie||"Paiement")+" - "+(db.students.find(s=>s.id===p.studentId)?.nom||""),source:"payment"}));
  db.revenues.forEach(r=>list.push({id:r.id,date:r.date,type:"entrée",montant:r.montant,description:r.description,source:"revenue"}));
  db.expenses.forEach(e=>list.push({id:e.id,date:e.date,type:"sortie",montant:e.montant,description:e.description,source:"expense"}));
  db.cashManual.forEach(m=>list.push({...m,source:"manual"}));
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));

  const balance = list.reduce((a,m)=>a+(m.type==="entrée"?m.montant:-m.montant),0);
  const totalIn = list.filter(m=>m.type==="entrée").reduce((a,m)=>a+m.montant,0);
  const totalOut = list.filter(m=>m.type==="sortie").reduce((a,m)=>a+m.montant,0);

  const q = (window.__cashQ||"").toLowerCase().trim();
  const fType = window.__cashType || "";
  const fMois = !!window.__cashMois;
  const mk = monthKey(todayISO());
  const vue = list.filter(m=>(!fType || m.type===fType) && (!fMois || monthKey(m.date)===mk) && (!q || m.description.toLowerCase().includes(q)));
  const vIn = vue.filter(m=>m.type==="entrée").reduce((a,m)=>a+m.montant,0);
  const vOut = vue.filter(m=>m.type==="sortie").reduce((a,m)=>a+m.montant,0);
  const del = m => m.source==="manual" ? `<button class="icon-btn danger" data-action="request-delete-cash" data-id="${m.id}" title="Supprimer">${ICO.trash}</button>` : "";

  const rows = vue.map(m=>`<tr>
    <td>${formatDate(m.date)}</td><td style="font-weight:600;">${esc(m.description)}</td>
    <td><span class="pill ${m.type==='entrée'?'in':'out'}">${m.type}</span></td>
    <td style="font-weight:700;color:${m.type==='entrée'?'var(--emerald-700)':'var(--red-600)'};">${m.type==='entrée'?"+":"−"} ${formatFCFA(m.montant)}</td>
    <td style="text-align:right;">${del(m)}</td>
  </tr>`).join("");
  const cards = vue.map(m=>`<div class="stu-card"><div class="stu-top">
      <div class="stu-id"><b>${esc(m.description)}</b><small>${formatDate(m.date)} · <span class="pill ${m.type==='entrée'?'in':'out'}">${m.type}</span></small></div>
      <div class="stu-rest ${m.type==='entrée'?'ok':'due'}">${m.type==='entrée'?"+":"−"} ${formatFCFA(m.montant)}</div>${del(m)}
    </div></div>`).join("");
  const seg = (on,label,js)=>`<button type="button" class="seg ${on?"on":""}" onclick="${js}; render();">${label}</button>`;

  return `<div class="grid-gap">
    <div class="grid3">
      ${statCard("Solde de caisse", formatFCFA(balance), "🐷", "blue")}
      ${statCard("Total entrées", formatFCFA(totalIn), "📈", "emerald")}
      ${statCard("Total sorties", formatFCFA(totalOut), "📉", "red")}
    </div>
    <div class="card p5">
      <h3 class="title">➕ Ajouter un mouvement manuel de caisse</h3>
      <div class="grid3">
        ${field("Type", `<select id="cm-type"><option value="entrée">Entrée</option><option value="sortie">Sortie</option></select>`)}
        ${field("Description *", `<input id="cm-desc">`)}
        ${field("Montant (FCFA) *", `<input id="cm-montant" type="number" inputmode="numeric">`)}
        ${field("Date", `<input id="cm-date" type="date" value="${todayISO()}">`)}
      </div>
      <button class="btn btn-navy" style="margin-top:16px;" data-action="add-cash-manual">💾 Ajouter le mouvement</button>
    </div>
    <div class="card p5">
      <div class="row between wrap-gap" style="margin-bottom:12px;">
        <h3 class="title" style="margin:0;">Journal de caisse (${vue.length}${vue.length!==list.length?" / "+list.length:""})</h3>
        <input id="cash-search" class="stu-search" style="max-width:260px;" placeholder="🔍 Rechercher…" value="${esc(window.__cashQ||"")}" oninput="window.__cashQ=this.value; renderKeepFocus('cash-search');">
      </div>
      <div class="segs" style="margin-bottom:12px;">
        ${seg(fType==="","Tout","window.__cashType=''")}${seg(fType==="entrée","Entrées","window.__cashType='entrée'")}${seg(fType==="sortie","Sorties","window.__cashType='sortie'")}${seg(fMois,"📅 Ce mois-ci","window.__cashMois=!window.__cashMois")}
      </div>
      <div class="stu-chips" style="margin-bottom:12px;"><span class="chip">Entrées : ${formatFCFA(vIn)}</span><span class="chip">Sorties : ${formatFCFA(vOut)}</span><span class="chip">Solde affiché : ${formatFCFA(vIn-vOut)}</span></div>
      <div class="stu-table" style="overflow-x:auto;"><table>
        <thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Montant</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="empty-row">Aucun mouvement</td></tr>`}</tbody>
      </table></div>
      <div class="stu-cards">${cards || `<p class="empty-row">Aucun mouvement</p>`}</div>
    </div>
  </div>`;
}

function bulletinTabHTML(){
  if(db.students.length===0){
    return `<div class="card p5"><p class="empty-row">Aucun élève enregistré. Inscrivez d'abord un élève dans l'onglet Élèves.</p></div>`;
  }
  const bClasse = window.__bulClasse || "";
  const liste = [...db.students].filter(s=>!bClasse || s.classe===bClasse).sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom));
  const pool = liste.length ? liste : [...db.students].sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom));
  const studentId = window.__bulletinStudentId && pool.some(s=>s.id===window.__bulletinStudentId) ? window.__bulletinStudentId : pool[0].id;
  const student = db.students.find(s=>s.id===studentId);
  const periode = window.__bulPeriode || PERIODES[0];
  const annee = window.__bulAnnee || currentSchoolYear();
  const studentOptions = pool
    .map(s=>`<option value="${s.id}" ${s.id===studentId?"selected":""}>${esc(s.nom)} ${esc(s.prenom)} (${esc(s.classe)})</option>`).join("");

  const existing = getBulletin(studentId, periode, annee);
  const disc = existing ? existing.disciplines : DISCIPLINES.map(nom=>({nom, obtenu:"", perf:"", appreciation:""}));
  const meta = existing || {matricule:"",sexe:"",groupe:"",effectif:"",redoublant:redoublantAuto(student, annee),evaluation:"",assiduite:"",disciplineConduite:"",defauts:"",qualites:"",appreciationMaitre:"",decisionConseil:""};

      <h3 class="title">🎓 Choisir un élève</h3>

      </div>
      <div class="muted" style="margin-top:8px;font-size:12.5px;">Élève ${idx+1} sur ${pool.length}${bClasse?" · "+esc(bClasse):""}</div>

const DISC_COURT = {
  "Français (Communication Orale)":"Comm. orale",
  "Français (Compréhension de l'écrit)":"Compréhension",
  "Français (Expression Écrite)":"Expr. écrite",
  "Français (Dictée)":"Dictée",
  "Mathématique":"Maths",
  "Éducation Sociale (Écrite)":"Éd. sociale",
  "Éducation Scientifique et Technologique (Écrite)":"EST",
  "Anglais":"Anglais",
  "Éducation Artistique (Poésie / Chansonette)":"Poésie",
  "Éducation Artistique (Dessin / Couture)":"Dessin",
  "Éducation Physique et Sportive":"EPS"
};
const DECISIONS = ["Passage","Redoublement","Abandon","Transféré"];
const NOTE_MAX = 20;
const NC_DRAFT_KEY = "academia-nc-brouillon-v1";

/* Brouillon : les notes tapées restent même sans enregistrer (gardées sur l'appareil) */
function ncDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(NC_DRAFT_KEY)||"null");
    if(d && d.notes && d.dec) return d;
  }catch(e){}
  return {notes:{}, dec:{}};
}
function ncDraftWrite(d){ try{ localStorage.setItem(NC_DRAFT_KEY, JSON.stringify(d)); }catch(e){} }
function ncAnnee(){ return window.__bulAnnee || currentSchoolYear(); }
function ncPeriode(){ return window.__bulPeriode || PERIODES[0]; }
function ncCtx(){ return ncAnnee()+"|"+ncPeriode(); }
function ncInvalide(v){ return v!=="" && (isNaN(Number(v)) || Number(v)<0 || Number(v)>NOTE_MAX); }

function ncEleves(classe){
  return db.students.filter(s=>s.classe===classe && s.statut!=="inactif")
    .sort((a,b)=>(a.nom+" "+a.prenom).localeCompare(b.nom+" "+b.prenom));
}
function redoublantAuto(st, annee){
  const m = /^(\d{4})-(\d{4})$/.exec(annee||"");
  if(!m) return "Non";
  const prev = (Number(m[1])-1)+"-"+(Number(m[2])-1);
  return (st && st.decisions && st.decisions[prev]==="Redoublement") ? "Oui" : "Non";
}
const ORDRE_CLASSES = ["CI","CP","CE1","CE2","CM1","CM2"];
function classeSuperieure(classe){
  const m = /^\s*(CI|CP|CE\s?1|CE\s?2|CM\s?1|CM\s?2)(.*)$/i.exec(classe||"");
  if(!m) return classe||"";
  const idx = ORDRE_CLASSES.indexOf(m[1].replace(/\s/g,"").toUpperCase());
  if(idx<0 || idx>=ORDRE_CLASSES.length-1) return classe;
  return ORDRE_CLASSES[idx+1] + m[2];
}
function decisionBulletinHTML(student, b, annee){
  const dec = student && student.decisions ? student.decisions[annee] : "";
  const txt = (b && b.decisionConseil) ? esc(b.decisionConseil) : "";
  if(!dec) return txt;
  return "<b>"+esc(dec)+"</b>" + (txt ? " — "+txt : "");
}

      <div class="row wrap-gap" style="gap:10px;">
        <select onchange="window.__ncClasse=this.value; render();" style="${selStyle}">

        </select>

          ${PERIODES.map(p=>`<option ${p===periode?"selected":""}>${p}</option>`).join("")}
        </select>
        <input value="${esc(annee)}" oninput="window.__bulAnnee=this.value;" onblur="render();" style="${selStyle}width:110px;">
      </div>
    </div>
    <div class="card p5">
      ${eleves.length===0 ? `<p class="empty-row">Aucun élève actif dans cette classe.</p>` : `

        <span class="muted">${eleves.length} élève${eleves.length>1?"s":""} — ${esc(classe)} — ${esc(periode)} ${esc(annee)} <span class="chip ${nbComplets===eleves.length?"":"warn"}" style="margin-left:6px;">✅ ${nbComplets}/${eleves.length} complets</span></span>
        <button class="btn btn-navy" data-action="nc-save">💾 Enregistrer toutes les notes</button>

      <div class="nc-wrap"><table class="nc-table">

function ncInput(el, r){
  const d = ncDraft();
  const ctx = ncCtx();
  const sid = el.dataset.sid;
  d.notes[ctx] = d.notes[ctx] || {};
  d.notes[ctx][sid] = d.notes[ctx][sid] || {};
  d.notes[ctx][sid][el.dataset.d] = el.value;
  ncDraftWrite(d);
  el.classList.toggle("nc-bad", ncInvalide(el.value.trim()));
  ncMoyenne(r);
}
function ncDecision(sel){
  const d = ncDraft();
  const annee = ncAnnee();
  d.dec[annee] = d.dec[annee] || {};
  d.dec[annee][sel.dataset.sid] = sel.value;
  ncDraftWrite(d);
}
function ncMoyenne(r){
  const cell = document.getElementById("nc-moy-"+r);
  if(!cell) return;
  const m = moyennePonderee(DISCIPLINES.map((n,i)=>{ const el=document.getElementById("nc-"+r+"-"+i); return {nom:n, obtenu: el? el.value : ""}; }));
  if(m===null){ cell.textContent="-"; cell.className="nc-moy"; return; }
  cell.textContent = m.toFixed(2);
  cell.className = "nc-moy " + (m>=10?"ok":"ko");
}
function bulSwitch(id, classe){
  if(window.__bulDirty && !confirm("Des modifications ne sont pas enregistrées. Continuer sans enregistrer ?")) return;
  window.__bulDirty = false;
  if(classe!==undefined && classe!==null){ window.__bulClasse = classe; window.__bulletinStudentId = ""; }
  else if(id){ window.__bulletinStudentId = id; }
  render();
}

function collectPayTypes(){
  return payTypes().map((t,i)=>{
    const nomEl=document.getElementById("pt-nom-"+i);
    if(!nomEl) return {...t};
    const scol=t.groupe==="scol", g=document.getElementById("pt-groupe-"+i);
    return {
      nom: scol ? t.nom : (nomEl.value.trim() || t.nom),
      montant: Math.max(0, Number(document.getElementById("pt-montant-"+i).value)||0),
      groupe: scol ? "scol" : (g ? g.value : (t.groupe||"autres"))
    };
  });
}
function payTypesDoublon(l){ const n=l.map(t=>t.nom.toLowerCase()); return new Set(n).size!==n.length; }
function savePayTypes(){
  const l=collectPayTypes();
  if(payTypesDoublon(l)){ showToast("Deux types de paiement portent le même nom","error"); return; }
  db.meta.paymentTypes=l; saveDB(); showToast("Types de paiement enregistrés"); render();
}
function addPayType(){
  const nom=val("pt-new-nom"), montant=Math.max(0,Number(val("pt-new-montant"))||0), g=val("pt-new-groupe")||"autres";
  if(!nom){ showToast("Donnez un nom au type de paiement","error"); return; }
  const l=collectPayTypes();
  if(l.some(t=>t.nom.toLowerCase()===nom.toLowerCase())){ showToast("Ce type de paiement existe déjà","error"); return; }
  l.push({nom, montant, groupe:g});
  db.meta.paymentTypes=l; saveDB(); showToast("Type de paiement ajouté"); render();
}
function delPayType(i){
  const l=collectPayTypes(), t=l[i];
  if(!t || t.groupe==="scol") return;
  l.splice(i,1);
  db.meta.paymentTypes=l; saveDB(); showToast("Type de paiement supprimé"); render();
}
function saveCoefs(){
  const coefs = {};
  for(let i=0;i<DISCIPLINES.length;i++){
    const v = Number(val("coef-"+i));
    if(!(v>0)){ showToast("Coefficient invalide : "+DISCIPLINES[i],"error"); return; }
    coefs[DISCIPLINES[i]] = v;
  }
  db.meta.coefficients = coefs;
  saveDB(); showToast("Coefficients enregistrés");
}
function bulMoyAuto(){
  const cell = document.getElementById("bul-moy-auto");
  if(!cell) return;
  const m = moyennePonderee(DISCIPLINES.map((n,i)=>{ const el=document.getElementById("bd-"+i+"-obtenu"); return {nom:n, obtenu: el? el.value : ""}; }));
  cell.textContent = m===null ? "-" : m.toFixed(2);
  cell.style.color = m===null ? "var(--navy-950)" : (m>=10 ? "var(--emerald-700)" : "var(--red-600)");
  cell.style.fontSize = "20px";

function ncEnter(e, r, i){
  if(e.key!=="Enter") return;
  e.preventDefault();
  const next = document.getElementById("nc-"+(r+1)+"-"+i) || document.getElementById("nc-0-"+(i+1));
  if(next){ next.focus(); if(next.select) next.select(); }
}
function ncResetBrouillon(){
  if(!confirm("Annuler toutes les modifications non enregistrées de cette classe ?")) return;
  const classes = allClasses();
  const classe = classes.includes(window.__ncClasse) ? window.__ncClasse : classes[0];
  const d = ncDraft();
  const ctx = ncCtx(), annee = ncAnnee();
  ncEleves(classe).forEach(st=>{
    if(d.notes[ctx]) delete d.notes[ctx][st.id];
    if(d.dec[annee]) delete d.dec[annee][st.id];
  });
  ncDraftWrite(d);
  render();
}
function saveNotesClasse(){
  const classes = allClasses();
  const classe = classes.includes(window.__ncClasse) ? window.__ncClasse : classes[0];
  const periode = ncPeriode();
  const annee = ncAnnee();
  const eleves = ncEleves(classe);
  // Validation d'abord : rien n'est enregistré si une valeur est invalide
  for(let r=0;r<eleves.length;r++){
    for(let i=0;i<DISCIPLINES.length;i++){
      const el = document.getElementById("nc-"+r+"-"+i);
      const v = el ? el.value.trim() : "";
      if(ncInvalide(v)){
        showToast("Note invalide (0 à "+NOTE_MAX+") : "+eleves[r].nom+" "+eleves[r].prenom+" — "+(DISC_COURT[DISCIPLINES[i]]||DISCIPLINES[i]), "error");
        return;
      }
    }
  }
  let nbMaj = 0;
  eleves.forEach((st,r)=>{
    const saisies = DISCIPLINES.map((nom,i)=>{ const el=document.getElementById("nc-"+r+"-"+i); return el? el.value.trim() : ""; });
    const existing = getBulletin(st.id, periode, annee);
    if(existing){
      const disciplines = DISCIPLINES.map((nom,i)=>{
        const d = existing.disciplines.find(x=>x.nom===nom) || {nom, obtenu:"", perf:"", appreciation:""};
        return {...d, obtenu: saisies[i]};
      });
      if(JSON.stringify(disciplines)!==JSON.stringify(existing.disciplines)){
        db.bulletins = db.bulletins.map(b=> b.id===existing.id ? {...b, disciplines} : b);
        nbMaj++;
      }
    } else if(saisies.some(v=>v!=="")){
      db.bulletins.push({
        id: uid(), studentId: st.id, periode, anneeScolaire: annee,
        matricule:"", sexe: st.sexe||"M", groupe:"", effectif: String(eleves.length),
        redoublant: redoublantAuto(st, annee), evaluation:"",
        disciplines: DISCIPLINES.map((nom,i)=>({nom, obtenu: saisies[i], perf:"", appreciation:""})),
        assiduite:"", disciplineConduite:"", defauts:"", qualites:"", appreciationMaitre:"", decisionConseil:""
      });
      nbMaj++;
    }
    // Décision de fin d'année (Passage / Redoublement / Abandon / Transféré)
    const selDec = document.getElementById("nc-dec-"+r);
    if(selDec){
      const dec = selDec.value;
      const cur = (st.decisions||{})[annee] || "";
      if(dec!==cur){
        db.students = db.students.map(x=>{
          if(x.id!==st.id) return x;
          const o = {...(x.decisions||{})};
          if(dec) o[annee]=dec; else delete o[annee];
          return {...x, decisions:o};
        });
        nbMaj++;
      }
    }
  });
  saveDB();
  // Le brouillon de ces élèves devient inutile : tout est enregistré
  const d = ncDraft(); const ctx = ncCtx();
  eleves.forEach(st=>{
    if(d.notes[ctx]) delete d.notes[ctx][st.id];
    if(d.dec[annee]) delete d.dec[annee][st.id];
  });
  ncDraftWrite(d);
  showToast(nbMaj>0 ? "Enregistré ("+nbMaj+" modification"+(nbMaj>1?"s":"")+")" : "Aucun changement à enregistrer");
}

function bulletinSheetHTML(student, b, periode, annee){
  const moyenne = bulletinMoyenne(b);
  const nbMoyennes = b.disciplines.filter(d=>d.obtenu!=="" && !isNaN(parseFloat(d.obtenu))).length;
  const seuil = moyenne===null? "-" : (moyenne>=10? "Oui":"Non");
  const mates = classmateBulletins(student.classe, periode, annee);
  let rang = "-";
  if(moyenne!==null && mates.length>0){
    const mc = Number(moyenne.toFixed(2));
    const meilleurs = mates.filter(x=>Number(x.moyenne.toFixed(2))>mc).length;
    const memes = mates.filter(x=>Number(x.moyenne.toFixed(2))===mc).length;
    rang = (meilleurs+1) + (meilleurs===0 ? (meilleurs+1===1?"er":"e") : "e") + (memes>1 ? " ex æquo" : "") + (mates.length>1? " / "+mates.length : "");
  }
  const plusFaible = mates.length>0? Math.min(...mates.map(x=>x.moyenne)).toFixed(2) : "-";
  const plusForte = mates.length>0? Math.max(...mates.map(x=>x.moyenne)).toFixed(2) : "-";
  const totalObtenu = b.disciplines.reduce((a,d)=>a+(parseFloat(d.obtenu)||0),0);
  const totalPerf = b.disciplines.reduce((a,d)=>a+(parseFloat(d.perf)||0),0);

  const rows = b.disciplines.map((d,i)=>`<tr>
    <td style="text-align:left;">${i+1}. ${esc(d.nom)}${coefLabel(d.nom)}</td>
    <td style="text-align:center;">${esc(d.obtenu)}</td>
    <td style="text-align:center;">${esc(d.perf)}</td>

          ${db.meta.ministryLine? `<div>${esc(db.meta.ministryLine)}</div><div>----------------------</div>`:""}

          ${db.meta.circonscriptionLine? `<div>${esc(db.meta.circonscriptionLine)}</div>`:""}

          <img src="${BENIN_FLAG_SRC}" alt="Drapeau du Bénin" class="bul-flag-img">
          <div class="bul-right-info">
            <div>ANNÉE SCOLAIRE : ${esc(annee)}</div>

            <div>ÉVALUATION : ${esc(b.evaluation)||"-"}</div>
          </div>
        </div>

      <div class="bul-title-box">BULLETIN DE NOTES — ${esc(periode).toUpperCase()}</div>

      <div class="bul-info">
        <div class="bul-info-row"><span>Nom de l'élève : <b>${esc(student.nom)}</b></span><span>Classe : <b>${esc(student.classe)}</b></span></div>

        <tbody>

  box.innerHTML=`<span class="chip">✅ ${oui} continuent</span><span class="chip ${cases.length-oui?"warn":""}">🚪 ${cases.length-oui} ne continuent pas</span>`;
}

function applyBulkFrais(){
  const frais = val("rentree-bulk-frais");
  if(!frais) return;
  document.querySelectorAll('[id^="rentree-cont-"]').forEach(chk=>{
    if(chk.checked){
      const id = chk.id.replace("rentree-cont-","");
      const idx = payTypes().findIndex(t=>t.groupe==="scol");
      const input = document.getElementById("rt"+id+"-amt-"+idx), box = document.getElementById("rt"+id+"-chk-"+idx);
      if(input && box){ box.checked = true; input.disabled = false; input.value = frais; }
    }
  });
}
function validateRentree(){
  const y = db.meta.anneeScolaireActuelle;
  if(!confirm(`Valider la rentrée et passer à l'année ${schoolYearLabel(y+1)} ? Les élèves non cochés seront marqués non reconduits. Cette action peut être répétée sans danger si besoin.`)) return;
  const actifs = [...db.students].filter(s=>s.statut!=="inactif");
  actifs.forEach(s=>{
    const contCheckbox = document.getElementById("rentree-cont-"+s.id);
    const continue_ = contCheckbox? contCheckbox.checked : true;
    if(continue_){
      const classe = val("rentree-classe-"+s.id) || s.classe;
      const fraisDus = readFees("rt"+s.id), sn = scolName();
      db.students = db.students.map(st => st.id===s.id? (Object.keys(fraisDus).length
        ? {...st, classe, fraisAnnuel:Number(fraisDus[sn])||0, fraisDus, statut:"actif"}
        : {...st, classe, statut:"actif"}) : st);
    } else {
      const decS = (s.decisions||{})[schoolYearLabel(y)] || "";
      const motif = (decS==="Abandon" || decS==="Transféré") ? decS : "Non reconduit";
      db.students = db.students.map(st => st.id===s.id? {...st, statut:"inactif", motifSortie:motif} : st);
    }
  });
  db.meta.anneeScolaireActuelle = y + 1;
  saveDB(); showToast(`Rentrée validée — année ${schoolYearLabel(y+1)} démarrée`); render();
}
function reactivateStudent(id){
  db.students = db.students.map(s=> s.id===id? {...s, statut:"actif", motifSortie:""} : s);
  saveDB(); showToast("Élève réactivé"); render();
}

/* ---- Archives annuelles ---- */
function activityYears(){
  const set = new Set();
  db.payments.forEach(p=>{ if(p.date) set.add(new Date(p.date).getFullYear()); });
  db.revenues.forEach(r=>{ if(r.date) set.add(new Date(r.date).getFullYear()); });
  db.expenses.forEach(e=>{ if(e.date) set.add(new Date(e.date).getFullYear()); });
  db.students.forEach(s=>{ if(s.dateInscription) set.add(new Date(s.dateInscription).getFullYear()); });
  return [...set].filter(y=>!isNaN(y)).sort((a,b)=>b-a);
}

  return `<div class="row between wrap-gap no-print" style="margin-bottom:16px;">
    <button class="link-btn" data-action="close-report">✖️ Fermer ce rapport</button>

function monthlyReportHTML(month){

function classReportHTML(start, end){
  const effectifs = effectifsParClasse();
  const totalGarcons = effectifs.reduce((a,c)=>a+c.garcons,0);
  const totalFilles = effectifs.reduce((a,c)=>a+c.filles,0);
  const totalGeneral = totalGarcons+totalFilles;
  const hasPeriod = !!(start||end);
  const nomClasse = c => c || "Sans classe";
  const map = {};
  const getC = cl => (map[cl] = map[cl] || {classe:cl, du:0, nbEleves:0, bd:newBreakdown(), eleves:{}});
  const studentById = {};
  db.students.forEach(st=>{ studentById[st.id]=st; const c=getC(st.classe); c.du += Number(st.fraisAnnuel)||0; c.nbEleves += 1; });
  reportPayments(start,end).forEach(pay=>{
    const st = studentById[pay.studentId]; if(!st) return;
    const c = getC(st.classe);
    addPaymentToBreakdown(c.bd, pay);
    const e = (c.eleves[st.id] = c.eleves[st.id] || {st, bd:newBreakdown(), dates:[]});
    addPaymentToBreakdown(e.bd, pay);
    if(!e.dates.includes(pay.date)) e.dates.push(pay.date);
  });
  const classes = Object.values(map);
  const byTotal = [...classes].sort((a,b)=>b.bd.total-a.bd.total);
  const grand = newBreakdown(); let grandDu = 0, grandEleves = 0;
  classes.forEach(c=>{ addBreakdowns(grand, c.bd); grandDu += c.du; grandEleves += c.nbEleves; });
  const taux = (scol,du)=> du>0? ((scol/du)*100).toFixed(1)+" %" : "-";
  const summaryRows = byTotal.map(c=>[esc(nomClasse(c.classe)), c.nbEleves, fmtNum(c.du), fmtNum(c.bd.scol), fmtNum(c.bd.autres), fmtNum(c.bd.unif), `<b>${fmtNum(c.bd.total)}</b>`, taux(c.bd.scol,c.du)]);
  if(summaryRows.length){ const t = ["<b>TOTAL ÉCOLE</b>", grandEleves, fmtNum(grandDu), fmtNum(grand.scol), fmtNum(grand.autres), fmtNum(grand.unif), fmtNum(grand.total), taux(grand.scol,grandDu)]; t.__total = true; summaryRows.push(t); }

  let detailHTML = "";
  if(hasPeriod){
    const periodTxt = periodLabel(start,end,"").replace(/^ · /,"");
    const withPay = [...classes].filter(c=>c.bd.total>0).sort((a,b)=>nomClasse(a.classe).localeCompare(nomClasse(b.classe),"fr",{numeric:true}));
    detailHTML = `<h4 style="color:var(--navy-950);margin-top:26px;">Entrées par classe — ${esc(periodTxt)}</h4>` + (withPay.length? withPay.map(c=>{
      const eleves = Object.values(c.eleves).sort((a,b)=>(a.st.nom+" "+a.st.prenom).localeCompare(b.st.nom+" "+b.st.prenom));
      const rows = eleves.map((e,i)=>[i+1, esc(e.st.nom+" "+e.st.prenom), e.dates.slice().sort().map(formatDate).join(", "), fmtNum(e.bd.scol), fmtNum(e.bd.autres), fmtNum(e.bd.unif), `<b>${fmtNum(e.bd.total)}</b>`]);
      const t = ["","<b>TOTAL "+esc(nomClasse(c.classe))+"</b> · "+eleves.length+" élève(s) ayant payé","",fmtNum(c.bd.scol),fmtNum(c.bd.autres),fmtNum(c.bd.unif),fmtNum(c.bd.total)]; t.__total = true; rows.push(t);
      return `<h5 style="color:var(--navy-900);margin:18px 0 6px;font-size:14px;page-break-after:avoid;">Classe ${esc(nomClasse(c.classe))}</h5>` + reportTableHTML(["N°","Élève","Date(s) de paiement","Scolarité","Autres frais","Uniformes","Total"], rows, true);
    }).join("") : `<p class="muted">Aucun paiement enregistré sur cette période.</p>`);
  }

  return `${reportHeaderHTML("Rapport par classe", periodLabel(start,end,classes.length+" classe(s)"))}
    <h4 style="color:var(--navy-950);">Effectifs par classe</h4>
    ${reportTableHTML(["Classe","Garçons","Filles","Total"], effectifs.map(c=>[esc(c.classe),c.garcons,c.filles,`<b>${c.total}</b>`]))}
    <div class="amount-box" style="margin-top:14px;">
      <div>
        <div class="amount-lbl">Total garçons: <b>${totalGarcons}</b> &nbsp; · &nbsp; Total filles: <b>${totalFilles}</b></div>
      </div>
      <div class="amount-val">${totalGeneral} élève(s) — TOUTE L'ÉCOLE</div>
    </div>
    <h4 style="color:var(--navy-950);margin-top:22px;">Situation financière par classe${hasPeriod? " (encaissements sur la période)":" (année "+schoolYearLabel(db.meta.anneeScolaireActuelle)+")"}</h4>
    ${reportTableHTML(["Classe","Nb élèves","Total dû (scolarité)","Scolarité","Autres frais","Uniformes","Total encaissé","Taux de recouvrement"], summaryRows, true)}
    <div class="muted" style="margin-top:10px;font-size:12px;">${REPORT_PAY_NOTE} Le taux de recouvrement compare la scolarité encaissée au total dû.</div>
    ${detailHTML}`;
}

function resultatsReportHTML(classe, periode, annee){
  const eleves = ncEleves(classe);
  const lignes = eleves.map(st=>{ const b=getBulletin(st.id,periode,annee); return {st,b,m:bulletinMoyenne(b)}; });
  const avec = lignes.filter(x=>x.m!==null).sort((a,c)=>c.m-a.m);
  let rang=0, prec=null;
  avec.forEach((x,i)=>{ const cle=x.m.toFixed(2); if(cle!==prec){ rang=i+1; prec=cle; } x.rang=rang; });
  const sans = lignes.filter(x=>x.m===null);
  const rows = [...avec,...sans].map(x=>[
    x.rang ? (x.rang===1?"1er":x.rang+"e") : "-",
    esc(x.st.nom)+" "+esc(x.st.prenom),
    x.st.sexe==="F"?"F":"M",
    ...DISCIPLINES.map(nom=>{ const d=x.b? x.b.disciplines.find(y=>y.nom===nom) : null; return d && d.obtenu!=="" ? esc(d.obtenu) : "-"; }),
    x.m!==null ? `<b>${x.m.toFixed(2)}</b>` : "-",
    esc((x.st.decisions||{})[annee]||"-")
  ]);

    ? `Effectif : ${eleves.length} · Avec notes : ${ms.length} · Moyenne de la classe : <b>${moyClasse}</b> / ${NOTE_MAX} · Plus forte : ${Math.max(...ms).toFixed(2)} · Plus faible : ${Math.min(...ms).toFixed(2)} · Moyenne ≥ 10 : ${reussite} (${Math.round(reussite*100/ms.length)} %)`
    : `Effectif : ${eleves.length} · Aucune note enregistrée pour cette période.`;

function profitReportHTML(start, end){
  const payments = db.payments.filter(p=>inPeriod(p.date,start,end));
  const revenues = db.revenues.filter(r=>inPeriod(r.date,start,end));
  const expenses = db.expenses.filter(e=>inPeriod(e.date,start,end));
  const allPayments = payments.reduce((a,p)=>a+p.montant,0);
  const totalRevenuesOther = revenues.reduce((a,r)=>a+r.montant,0);
  const totalRevenue = allPayments+totalRevenuesOther;
  const totalExpenses = expenses.reduce((a,e)=>a+e.montant,0);
  const profitBeforeTax = totalRevenue-totalExpenses;
  const aib = profitBeforeTax>0? profitBeforeTax*AIB_RATE : 0;
  const netProfit = profitBeforeTax-aib;
  return `${reportHeaderHTML("Rapport de bénéfice", periodLabel(start,end,"Situation globale"))}
    ${reportTableHTML(["Élément","Montant"], [
      ["Recettes - Paiements élèves (toutes catégories)", formatFCFA(allPayments)],
      ["Recettes - Autres", formatFCFA(totalRevenuesOther)],
      ["Chiffre d'affaires total", formatFCFA(totalRevenue)],
      ["Dépenses totales", formatFCFA(totalExpenses)],
      ["Bénéfice avant impôt", formatFCFA(profitBeforeTax)],
      ["AIB (4% du bénéfice)", formatFCFA(aib)],
      ["Bénéfice net", formatFCFA(netProfit)],
    ])}

}

function stripWhiteBackground(dataUrl, callback){
  const img = new Image();
  img.onload = function(){
    const canvas = document.createElement("canvas");
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    let imageData;
    try{ imageData = ctx.getImageData(0,0,canvas.width,canvas.height); }
    catch(e){ callback(dataUrl); return; }
    const d = imageData.data;
    const tLow = 222, tHigh = 250;
    for(let i=0;i<d.length;i+=4){
      const r=d[i], g=d[i+1], b=d[i+2];
      const minc = Math.min(r,g,b);
      let ramp = (minc - tLow)/(tHigh - tLow);
      ramp = Math.max(0, Math.min(1, ramp));
      const alphaNorm = 1 - ramp;
      const alphaSafe = Math.max(alphaNorm, 0.001);
      d[i]   = Math.max(0, Math.min(255, (r - (1-alphaSafe)*255)/alphaSafe));
      d[i+1] = Math.max(0, Math.min(255, (g - (1-alphaSafe)*255)/alphaSafe));
      d[i+2] = Math.max(0, Math.min(255, (b - (1-alphaSafe)*255)/alphaSafe));
      d[i+3] = Math.round(alphaNorm*255);
    }
    ctx.putImageData(imageData,0,0);
    callback(canvas.toDataURL("image/png"));
  };
  img.onerror = function(){ callback(dataUrl); };
  img.src = dataUrl;
}

  students:{nom:"Élève", d:x=>`${x.nom||""} ${x.prenom||""} (${x.classe||"-"})`},
  payments:{nom:"Paiement", d:x=>{ const st=db.students.find(s=>s.id===x.studentId); return `${formatFCFA(x.montant)} — ${st? st.nom+" "+st.prenom : "élève supprimé"} — ${x.categorie||""}`; }},

  cashManual:{nom:"Mouvement de caisse", d:x=>`${x.description||""} — ${formatFCFA(x.montant)} (${x.type||""})`},
  teachers:{nom:"Enseignant", d:x=>`${x.nom||""} ${x.prenom||""}`},
  salaryPayments:{nom:"Salaire", d:x=>{ const t=db.teachers.find(q=>q.id===x.teacherId); return `${formatFCFA(x.montant)} — ${t? t.nom+" "+t.prenom : "enseignant supprimé"}`; }},
  bulletins:{nom:"Bulletin", d:x=>{ const st=db.students.find(s=>s.id===x.studentId); return `${st? st.nom+" "+st.prenom : "élève supprimé"} — ${x.periode} ${x.anneeScolaire}`; }}
};
function jSnap(){
  const o = {};
  for(const k in J_COLLS){ o[k] = {}; (db[k]||[]).forEach(x=>{ o[k][x.id] = {j:JSON.stringify(x), d:J_COLLS[k].d(x)}; }); }
  const {adminCode, secretaryCode, schoolLogo, nextReceiptSeq, nextSalaryReceiptSeq, ...reste} = db.meta || {};
  o.__meta = JSON.stringify(reste); o.__codes = JSON.stringify([adminCode, secretaryCode]); o.__logo = schoolLogo ? schoolLogo.length : 0;
  return o;
}
function jLog(type, cible, detail){
  if(!Array.isArray(db.journal)) db.journal = [];
  db.journal.unshift({id:uid(), t:new Date().toISOString(), role: role||"-", type, cible, detail});
  if(db.journal.length>1000) db.journal.length = 1000;
}
function jDiff(avant){
  const apres = jSnap();
  const ent = [];
  for(const k in J_COLLS){
    for(const id in apres[k]) if(!avant[k][id]) ent.push(["Ajout",k,apres[k][id].d]); else if(avant[k][id].j!==apres[k][id].j) ent.push(["Modification",k,apres[k][id].d]);
    for(const id in avant[k]) if(!apres[k][id]) ent.push(["Suppression",k,avant[k][id].d]);
  }
  const groupes = {};
  ent.forEach(([ty,k,d])=>{ (groupes[ty+"|"+k] = groupes[ty+"|"+k] || []).push(d); });
  for(const key in groupes){
    const [ty,k] = key.split("|"); const liste = groupes[key]; const nom = J_COLLS[k].nom;
    if(liste.length>3) jLog(ty, nom, liste.length+" éléments : "+liste.slice(0,3).join(" ; ")+" …");
    else liste.forEach(d=>jLog(ty, nom, d));
  }
  if(avant.__meta!==apres.__meta) jLog("Modification","Paramètres","Informations de l'école ou réglages");
  if(avant.__codes!==apres.__codes) jLog("Modification","Paramètres","Codes d'accès modifiés");
  if(avant.__logo!==apres.__logo) jLog("Modification","Paramètres","Logo de l'école");
  if(groupes && (Object.keys(groupes).length || avant.__meta!==apres.__meta || avant.__codes!==apres.__codes || avant.__logo!==apres.__logo)) saveDB();
}
function onAppClick(e){
  const t = e.target.closest ? e.target.closest("[data-action]") : null;
  const action = t ? (t.dataset.action||"") : "";
  if(!action || /^(set-|open-|close-|toggle-|back-|print|select-|exit|reset-|nav|export|restore)/.test(action)) return onAppClickCore(e);
  const avant = jSnap();
  try{ return onAppClickCore(e); }
  finally{ try{ jDiff(avant); }catch(err){} }
}
function onAppClickCore(e){
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const key = btn.dataset.key;
  const role_ = btn.dataset.role;

  switch(action){
    case "activate-license": activateLicense(); break;
    case "copy-device-id": {
      const code = btn.dataset.code || "";
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(()=>{ btn.textContent = "✅ Copié !"; setTimeout(()=>{ btn.textContent = "📋 Copier ce code"; }, 1500); });
      }

let __pdfjsLoadPromise = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(__pdfjsLoadPromise) return __pdfjsLoadPromise;
  __pdfjsLoadPromise = (async ()=>{
    // 1) Copie locale (fonctionne hors ligne, mise en cache par le service worker)
    try{
      const mod = await import("./vendor/pdf.min.js");
      mod.GlobalWorkerOptions.workerSrc = new URL("./vendor/pdf.worker.min.js", document.baseURI).href;
      window.pdfjsLib = mod;
      return;
    }catch(e){ /* repli sur le CDN ci-dessous */ }
    // 2) Repli : CDN (connexion internet nécessaire)
    await new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = ()=>{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        resolve();
      };
      s.onerror = ()=> reject(new Error("Impossible de charger l'outil de lecture PDF. Vérifiez votre connexion internet puis réessayez."));
      document.head.appendChild(s);
    });
  })();
  __pdfjsLoadPromise.catch(()=>{ __pdfjsLoadPromise = null; });
  return __pdfjsLoadPromise;
}
function looksLikeNameLine(s){
  if(!s || s.trim().length<3) return false;
  if(/^\d+$/.test(s.trim())) return false;
  if(/^(liste|classe|effectif|année|annee|n°|numero|nom|prénom|prenom|sexe|page)\b/i.test(s.trim())) return false;
  return true;
}
function splitNomPrenom(s){
  const parts = s.trim().split(/\s+/);
  if(parts.length===1) return {nom:parts[0], prenom:""};
  let i=0;
  while(i<parts.length-1 && parts[i]===parts[i].toUpperCase() && /[A-ZÀ-Ý]/.test(parts[i])) i++;
  if(i===0) i=1;
  return {nom: parts.slice(0,i).join(" "), prenom: parts.slice(i).join(" ")};
}
function parseNameLine(line){
  let s = line.replace(/^\d+[\.\)]?\s*/, "").trim();
  let sexe = "M";
  const m = s.match(/\s(M|F|Masculin|Féminin|Feminin)\.?$/i);
  if(m){ sexe = /^F/i.test(m[1]) ? "F" : "M"; s = s.slice(0, m.index).trim(); }
  const {nom, prenom} = splitNomPrenom(s);
  return {nom, prenom, sexe};
}
async function extractLinesFromPdf(file){
  await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  const lines = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const byY = {};
    content.items.forEach(it=>{
      const y = Math.round(it.transform[5]);
      (byY[y] = byY[y]||[]).push(it);
    });
    Object.keys(byY).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const text = byY[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
      if(text) lines.push(text);
    });
  }
  return lines;
}

function restoreBackupFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = ()=>{ input.value = ""; showToast("Impossible de lire ce fichier","error"); };
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ input.value = ""; showToast("Ce fichier n'est pas une sauvegarde valide","error"); return; }
    const src = data && data.db ? data.db : data;
    const valide = src && typeof src==="object" && Array.isArray(src.students) && Array.isArray(src.payments) && src.meta && typeof src.meta==="object";
    if(!valide){ input.value = ""; showToast("Ce fichier n'est pas une sauvegarde Academia","error"); return; }
    let quand = "";
    if(data.exportedAt){ const d = new Date(data.exportedAt); if(!isNaN(d)) quand = " du " + d.toLocaleDateString("fr-FR"); }
    if(!confirm("Restaurer la sauvegarde" + quand + " (" + src.students.length + " élève(s)) ?\n\nToutes les données actuelles de cet appareil seront REMPLACÉES. Pensez à exporter d'abord une sauvegarde de l'état actuel.")){ input.value = ""; return; }
    const base = emptyDB();
    const nouvelle = {...base, ...src, meta:{...base.meta, ...src.meta}};
    ["students","payments","revenues","expenses","cashManual","bulletins","teachers","salaryPayments"].forEach(k=>{ if(!Array.isArray(nouvelle[k])) nouvelle[k] = []; });
    db = nouvelle;
    jLog("Restauration","Données","Sauvegarde restaurée ("+nouvelle.students.length+" élèves)");
    saveDB();
    input.value = "";
    showToast("Sauvegarde restaurée");
    render();
  };
  reader.readAsText(file);
}

async function handlePdfFileSelected(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  pdfImportState = {step:"parsing"}; render();
  try{
    const lines = await extractLinesFromPdf(file);
    const rows = lines.filter(looksLikeNameLine).map(l=>({id:uid(), ...parseNameLine(l), include:true}));
    if(!rows.length){
      pdfImportState = {step:"upload", error:"Aucun nom n'a pu être détecté dans ce PDF. Vous pouvez toujours inscrire les élèves un par un ci-dessus."};
    } else {
      pdfImportState = {step:"preview", rows, classe:"", frais:"", date:todayISO(), error:null};
    }
  }catch(e){
    pdfImportState = {step:"upload", error: e.message || "Erreur lors de la lecture du PDF."};
  }
  render();
}

    matricule: val("bm-matricule"), sexe: val("bm-sexe"), groupe: val("bm-groupe"), effectif: val("bm-effectif"),
    redoublant: val("bm-redoublant"), evaluation: val("bm-evaluation"),
    disciplines,
    assiduite: val("bm-assiduite"), disciplineConduite: val("bm-disc-conduite"),
    defauts: val("bm-defauts"), qualites: val("bm-qualites"),
    appreciationMaitre: val("bm-appr-maitre"), decisionConseil: val("bm-decision"),
  };
  const existing = getBulletin(studentId, periode, annee);
  if(existing){ record.id = existing.id; db.bulletins = db.bulletins.map(b=> b.id===existing.id? record : b); }
  else { db.bulletins.push(record); }
  saveDB(); showToast("Bulletin enregistré"); render();
}
function addTeacher(){
  const nom=val("t-nom"), prenom=val("t-prenom"), poste=val("t-poste"), tel=val("t-tel"), salaire=val("t-salaire"), date=val("t-date");
  if(!nom||!prenom||!salaire){ showToast("Veuillez remplir les champs obligatoires","error"); return; }
  db.teachers.push({id:uid(), statut:"actif", nom, prenom, poste, telephone:tel, salaireMensuel:Number(salaire), dateEmbauche:date||todayISO()});
  saveDB(); showToast("Enseignant ajouté"); render();
}
function saveEditTeacher(id){
  const nom=val("et-nom"), prenom=val("et-prenom"), poste=val("et-poste"), tel=val("et-tel"), salaire=val("et-salaire"), date=val("et-date");
  db.teachers = db.teachers.map(t=> t.id===id? {...t, nom, prenom, poste, telephone:tel, salaireMensuel:Number(salaire), dateEmbauche:date} : t);
  saveDB(); modalState=null; showToast("Enseignant modifié"); render();
}
function addSalaryPayment(){
  const teacherId=val("sp-teacher"), montant=val("sp-montant"), date=val("sp-date"), mode=val("sp-mode"), note=val("sp-note");
  if(!teacherId||!montant){ showToast("Sélectionnez un enseignant et un montant","error"); return; }
  const teacher = db.teachers.find(t=>t.id===teacherId);
  const payDate = date||todayISO();
  const numero = db.meta.nextSalaryReceiptSeq || 1;
  db.meta.nextSalaryReceiptSeq = numero + 1;
  const payId = uid();
  const expenseId = uid();
  db.salaryPayments.push({id:payId, teacherId, montant:Number(montant), date:payDate, mode, note, mois:monthKey(payDate), numero, expenseRefId:expenseId});
  db.expenses.push({id:expenseId, description:"Salaire — "+(teacher? teacher.nom+" "+teacher.prenom : "Enseignant"), montant:Number(montant), categorie:"Salaires", date:payDate, source:"salary", salaryPaymentId:payId});
  saveDB(); showToast("Paiement de salaire enregistré"); render();
}
function saveEditStudent(id){
  const nom=val("e-nom"), prenom=val("e-prenom"), sexe=val("e-sexe"), classe=classValue("e-classe"), tel=val("e-tel"), date=val("e-date");
  const fraisDus=readFees("e"), sn=scolName();

  db.students = db.students.map(s=> s.id===id? {...s, nom, prenom, sexe, classe, telephoneParent:tel, fraisAnnuel:Number(fraisDus[sn])||0, fraisDus, dateInscription:date} : s);
  saveDB(); modalState=null; showToast("Élève modifié"); render();
}
function saveAdminCode(){
  const code = val("new-admin-code");
